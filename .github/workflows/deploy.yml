name: Deploy

on:
  push:
    branches: [main, claude/elegant-ritchie-hn78gl]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Update the server
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          body=$(printf '%s' "$DEPLOY_KEY" | sed 's/-----[A-Z ]*-----//g' | tr -d ' \t\r\n')
          { echo "-----BEGIN OPENSSH PRIVATE KEY-----"; echo "$body" | fold -w 70; echo "-----END OPENSSH PRIVATE KEY-----"; } > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keygen -y -f ~/.ssh/deploy > ~/.ssh/deploy.pub || { echo "DEPLOY_KEY is not a valid key: copy it again"; exit 1; }
          ssh-keygen -lf ~/.ssh/deploy.pub
          user=$(printf '%s' "$DEPLOY_USER" | tr -d ' \t\r\n')
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new \
            "$user@carwasheasy.co.za" 'cd ~/carwash && bash deploy/update.sh'
      - name: Check the site
        run: curl -fsS --retry 12 --retry-delay 5 --retry-all-errors https://carwasheasy.co.za/healthz
