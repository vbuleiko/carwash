{% from "_macros.html" import logo %}
<header class="site-nav">
  <a class="logo" href="{{ url_for('public.landing') }}">{{ logo() }} {{ g.host.name if g.host else config.APP_NAME }}</a>
  <nav>
    {% if session.tenant_id %}
      <a class="btn primary" href="{{ url_for('owner.board') }}">Open app</a>
    {% elif g.host %}
      <a class="btn" href="{{ url_for('public.landing') }}">Book a wash</a>
    {% else %}
      <a href="{{ url_for('public.login') }}">Log in</a>
      {% if request.endpoint != 'public.claim' %}<a class="btn primary" href="{{ url_for('public.signup') }}">Start free trial</a>{% endif %}
    {% endif %}
  </nav>
</header>
