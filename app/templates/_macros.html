{% macro icon(name) -%}
<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

{%- elif name == 'chat' -%}<path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.6A8.4 8.4 0 1 1 21 11.5z"/>
{%- elif name == 'check' -%}<path d="M20 6 9 17l-5-5"/>
{%- elif name == 'play' -%}<path d="m7 4 13 8-13 8z"/>
{%- elif name == 'star' -%}<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2-5.5-2.9-5.5 2.9 1-6.2L3 9.6l6.2-.9z"/>

{%- elif name == 'back' -%}<path d="M15 18l-6-6 6-6"/>
{%- elif name == 'search' -%}<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
{%- endif -%}
</svg>
{%- endmacro %}

{% macro flashes() -%}
{% with messages = get_flashed_messages(with_categories=true) %}
{% for category, message in messages %}
<div class="flash {{ 'flash-error' if category == 'error' else '' }}" role="status">{{ message }}</div>
{% endfor %}
{% endwith %}
{%- endmacro %}
