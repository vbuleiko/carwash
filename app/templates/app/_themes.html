{% from "_macros.html" import icon %}
<form method="post" action="{{ url_for('owner.settings_theme') }}" class="themes" data-look>
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
  {% for key, t in themes.items() %}
  <button name="theme" value="{{ key }}" class="theme-tile theme-{{ key }}" data-css="{{ theme_css(key) }}" data-bg="{{ t.bg }}" aria-pressed="{{ 'true' if key == theme else 'false' }}"
          style="--t-bg: {{ t.bg }}; --t-card: {{ t.card }}; --t-accent: {{ t.accent }}; --t-ink: {{ t.ink }}">
    <span class="theme-preview" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="theme-text">
      <b class="theme-name">{{ t.name }}</b>
      <span>{{ t.about }}</span>
    </span>
    {% if key == theme %}{{ icon('check') }}{% endif %}
  </button>
  {% endfor %}
</form>
