{% extends "base.html" %}
{% from "_macros.html" import flashes %}
{% block title %}Admin · {{ config.APP_NAME }}{% endblock %}
{% block body_class %}site{% endblock %}
{% block body %}
<main class="narrow">
  <h1>Admin</h1>
  {{ flashes() }}
  <form method="post" class="stack card">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label class="field"><span>Password</span><input type="password" name="password" required autofocus autocomplete="current-password"></label>
    <button class="btn primary wide">Log in</button>
  </form>
</main>
{% endblock %}
